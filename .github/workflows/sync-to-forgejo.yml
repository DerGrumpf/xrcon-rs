# Pushes every change on main from GitHub to Forgejo.
name: Sync to Forgejo

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Full history is needed to push all commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Push main to Forgejo over HTTPS with the token from the secret.
      - name: Push to Forgejo
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          git push "https://DerGrumpf:${FORGEJO_TOKEN}@git.cyperpunk.de/DerGrumpf/xrcon-rs.git" main

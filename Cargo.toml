[package]
name = "xrcon"
edition = "2024"
rust-version = "1.97"
version.workspace = true
license = "GPL-3.0-or-later"
description = "rcon client for Xonotic (DarkPlaces rcon protocol): CLI, Rust library and Python bindings"
repository = "https://github.com/DerGrumpf/xrcon-rs"

[features]
tokio = ["dep:tokio"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
configparser = "3.3.0"
hmac = "0.13.0"
md4 = "0.11.0"
rpassword = "7.5.4"
tokio = { version = "1", features = ["net", "time", "sync"], optional = true }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["python"]

[workspace.package]
version = "1.0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[[example]]
name = "nonblocking"
required-features = ["tokio"]

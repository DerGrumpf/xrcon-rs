[package]
name = "xrcon-python"
version.workspace = true
edition = "2024"

[lib]
name = "_xrcon"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
xrcon = { path = "..", features = ["tokio"] }

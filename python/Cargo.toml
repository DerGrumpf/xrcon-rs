[package]
name = "xrcon-python"
version = "0.1.0"
edition = "2024"

[lib]
name = "_xrcon"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.2"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
xrcon = { path = ".." }
xrcon-tokio = { path = "../tokio" }

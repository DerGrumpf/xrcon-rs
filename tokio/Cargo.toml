[package]
name = "xrcon-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "xrcon_tokio"

[dependencies]
xrcon = { path = ".." }
tokio = { version = "1", features = ["net", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
